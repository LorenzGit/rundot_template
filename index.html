<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <!-- Locked viewport: RUN games are fullscreen mobile apps; never let the page zoom or scroll. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <!-- ADAPT: game title -->
    <title>RUN game template</title>
    <!-- ADAPT: once the game has key art, ship it at a STABLE public path
         (public/boot-splash.jpg), preload it here, and use the same URL as the
         boot-cover background and in the React LoadingScreen — first paint and
         the React handoff then share one cached download instead of fetching a
         second Vite-hashed copy:
         <link rel="preload" as="image" href="./boot-splash.jpg" /> -->
    <style>
        /*
         * Instant boot shell: first paint must be the loading experience, not a
         * blank black rectangle while the module graph downloads. Inlined so it
         * never waits on the Vite CSS/JS bundles. React LoadingScreen takes over
         * with real progress once it mounts; this shell is then faded out.
         *
         * Boot contract:
         *  1. Loader visible immediately
         *  2. Main-menu assets load under the loader
         *  3. Menu shows when those assets are ready
         *  4. Never preload large media (videos, etc.) during this gate
         */
        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
            background: #2a1f5c;
            color: #fff;
            font-family: "Arial Rounded MT Bold", "Trebuchet MS", "Avenir Next", sans-serif;
            overflow: hidden;
            -webkit-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
        }
        #boot-cover {
            position: fixed;
            inset: 0;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 16px;
            padding: 0 34px;
            box-sizing: border-box;
            text-align: center;
            opacity: 1;
            transition: opacity 0.35s ease-out;
            pointer-events: none;
            background:
                radial-gradient(ellipse 80% 60% at 50% 40%, #4a3a9a 0%, #2a1f5c 70%, #1a1440 100%);
        }
        #boot-cover.hidden { opacity: 0; }
        #boot-cover .boot-mark {
            position: relative;
            width: 106px;
            height: 94px;
            border: 5px solid #fff;
            border-radius: 32px;
            background: linear-gradient(145deg, #72d9ff, #7373ec);
            box-shadow:
                inset 0 -12px 0 rgba(47, 46, 163, 0.2),
                0 9px 0 rgba(38, 25, 96, 0.42);
            animation: boot-float 1.8s ease-in-out infinite;
        }
        #boot-cover .boot-mark::before,
        #boot-cover .boot-mark::after {
            content: "";
            position: absolute;
            top: 25px;
            width: 18px;
            height: 7px;
            border-radius: 99px;
            background: rgba(255, 255, 255, 0.4);
        }
        #boot-cover .boot-mark::before { left: -18px; }
        #boot-cover .boot-mark::after { right: -18px; }
        #boot-cover .boot-eye {
            position: absolute;
            top: 29px;
            width: 10px;
            height: 14px;
            border-radius: 999px;
            background: #fff;
        }
        #boot-cover .boot-eye-l { left: 27px; }
        #boot-cover .boot-eye-r { right: 27px; }
        #boot-cover .boot-smile {
            position: absolute;
            right: 33px;
            bottom: 20px;
            left: 33px;
            height: 13px;
            border-bottom: 5px solid #fff;
            border-radius: 0 0 999px 999px;
        }
        #boot-cover .boot-title {
            display: flex;
            flex-direction: column;
            align-items: center;
            line-height: 0.82;
            filter: drop-shadow(0 5px 0 rgba(38, 25, 96, 0.36));
        }
        #boot-cover .boot-title span {
            border-radius: 999px;
            background: #f06e80;
            padding: 5px 18px 6px;
            color: #fff;
            font-size: 18px;
            font-weight: 1000;
            letter-spacing: 0.12em;
        }
        #boot-cover .boot-title strong {
            color: #fff4ac;
            font-size: 39px;
            letter-spacing: -0.04em;
            text-shadow: 0 3px 0 #7252bd;
        }
        #boot-cover .boot-track {
            width: 100%;
            max-width: 300px;
            height: 20px;
            overflow: hidden;
            border: 3px solid rgba(255, 255, 255, 0.7);
            border-radius: 999px;
            background: rgba(38, 25, 96, 0.44);
            padding: 3px;
            box-sizing: border-box;
        }
        #boot-cover .boot-fill {
            height: 100%;
            width: 28%;
            min-width: 5px;
            border-radius: 999px;
            background: linear-gradient(90deg, #59dda8, #ffe269);
            box-shadow: inset 0 2px 0 rgba(255, 255, 255, 0.54);
            /* Indeterminate until JS drives real progress via #boot-fill width */
            animation: boot-indeterminate 1.35s ease-in-out infinite;
            transition: width 0.2s ease-out;
        }
        #boot-cover.is-determinate .boot-fill {
            animation: none;
            transform: none;
        }
        #boot-cover .boot-copy {
            margin: 0;
            color: #e8e0ff;
            font-size: 12px;
            font-weight: 900;
            letter-spacing: 0.08em;
        }
        #root {
            position: fixed;
            inset: 0;
            background: #2a1f5c;
        }
        @keyframes boot-float {
            0%, 100% { transform: translateY(0) rotate(-1deg); }
            50% { transform: translateY(-8px) rotate(1deg); }
        }
        @keyframes boot-indeterminate {
            0%   { width: 12%; transform: translateX(0); }
            50%  { width: 55%; transform: translateX(40%); }
            100% { width: 12%; transform: translateX(220%); }
        }
    </style>
</head>
<body>
    <!-- ADAPT: aria-label game name -->
    <div id="boot-cover" role="progressbar" aria-busy="true" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-label="Loading PIXEL FOUNDRY">
        <div class="boot-mark" aria-hidden="true">
            <span class="boot-eye boot-eye-l"></span>
            <span class="boot-eye boot-eye-r"></span>
            <span class="boot-smile"></span>
        </div>
        <div class="boot-title">
            <!-- ADAPT: title marks -->
            <span>PIXEL</span>
            <strong>FOUNDRY</strong>
        </div>
        <div class="boot-track"><div class="boot-fill" id="boot-fill"></div></div>
        <p class="boot-copy" id="boot-copy">BUILDING THE FUN…</p>
    </div>
    <script>
        // Safety net: never leave the player staring at a stuck cover.
        // Safety net only — keep cover for a full load on slow networks.
        setTimeout(function () {
            var c = document.getElementById('boot-cover');
            if (c && !c.classList.contains('hidden')) c.classList.add('hidden');
        }, 30000);
    </script>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
</body>
</html>
