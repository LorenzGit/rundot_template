<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <!-- Locked viewport: RUN games are fullscreen mobile apps; never let the page zoom or scroll. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <!-- ADAPT: game title -->
    <title>RUN game template</title>
    <!-- ADAPT: once the game has key art, ship it at a STABLE public path
         (public/boot-splash.jpg), preload it here, and use the same URL as the
         boot-cover background and in the React LoadingScreen — first paint and
         the React handoff then share one cached download instead of fetching a
         second Vite-hashed copy:
         <link rel="preload" as="image" href="./boot-splash.jpg" /> -->
    <style>
        /*
         * Instant boot shell: first paint must be the loading experience, not a
         * blank black rectangle while the module graph downloads. Inlined so it
         * never waits on the Vite CSS/JS bundles. React LoadingScreen takes over
         * with real progress once it mounts; this shell is then faded out.
         *
         * Boot contract:
         *  1. Loader visible immediately
         *  2. Main-menu assets load under the loader
         *  3. Menu shows when those assets are ready
         *  4. Never preload large media (videos, etc.) during this gate
         */
        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
            background: #2a1f5c;
            color: #fff;
            font-family: "Arial Rounded MT Bold", "Trebuchet MS", "Avenir Next", sans-serif;
            overflow: hidden;
            -webkit-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
        }
        #boot-cover {
            position: fixed;
            inset: 0;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 16px;
            padding: 0 34px;
            box-sizing: border-box;
            text-align: center;
            opacity: 1;
            transition: opacity 0.35s ease-out;
            pointer-events: none;
            background:
                radial-gradient(ellipse 80% 60% at 50% 40%, #4a3a9a 0%, #2a1f5c 70%, #1a1440 100%);
        }
        #boot-cover.hidden { opacity: 0; }
        #boot-cover .boot-mark {
            position: relative;
            width: 106px;
            height: 94px;
            border: 5px solid #fff;
            border-radius: 32px;
            background: linear-gradient(145deg, #72d9ff, #7373ec);
            box-shadow:
                inset 0 -12px 0 rgba(47, 46, 163, 0.2),
                0 9px 0 rgba(38, 25, 96, 0.42);
            animation: boot-float 1.8s ease-in-out infinite;
        }
        #boot-cover .boot-mark::before,
        #boot-cover .boot-mark::after {
            content: "";
            position: absolute;
            top: 25px;
            width: 18px;
            height: 7px;
            border-radius: 99px;
            background: rgba(255, 255, 255, 0.4);
        }
        #boot-cover .boot-mark::before { left: -18px; }
        #boot-cover .boot-mark::after { right: -18px; }
        #boot-cover .boot-eye {
            position: absolute;
            top: 29px;
            width: 10px;
            height: 14px;
            border-radius: 999px;
            background: #fff;
        }
        #boot-cover .boot-eye-l { left: 27px; }
        #boot-cover .boot-eye-r { right: 27px; }
        #boot-cover .boot-smile {
            position: absolute;
            right: 33px;
            bottom: 20px;
            left: 33px;
            height: 13px;
            border-bottom: 5px solid #fff;
            border-radius: 0 0 999px 999px;
        }
        #boot-cover .boot-title {
            display: flex;
            flex-direction: column;
            align-items: center;
            line-height: 0.82;
            filter: drop-shadow(0 5px 0 rgba(38, 25, 96, 0.36));
        }
        #boot-cover .boot-title span {
            border-radius: 999px;
            background: #f06e80;
            padding: 5px 18px 6px;
            color: #fff;
            font-size: 18px;
            font-weight: 1000;
            letter-spacing: 0.12em;
        }
        #boot-cover .boot-title strong {
            color: #fff4ac;
            font-size: 39px;
            letter-spacing: -0.04em;
            text-shadow: 0 3px 0 #7252bd;
        }
        #boot-cover .boot-track {
            width: 100%;
            max-width: 300px;
            height: 20px;
            overflow: hidden;
            border: 3px solid rgba(255, 255, 255, 0.7);
            border-radius: 999px;
            background: rgba(38, 25, 96, 0.44);
            padding: 3px;
            box-sizing: border-box;
        }
        #boot-cover .boot-fill {
            height: 100%;
            width: 28%;
            min-width: 5px;
            border-radius: 999px;
            background: linear-gradient(90deg, #59dda8, #ffe269);
            box-shadow: inset 0 2px 0 rgba(255, 255, 255, 0.54);
            /* Indeterminate until JS drives real progress via #boot-fill width */
            animation: boot-indeterminate 1.35s ease-in-out infinite;
            transition: width 0.2s ease-out;
        }
        #boot-cover.is-determinate .boot-fill {
            animation: none;
            transform: none;
        }
        #boot-cover .boot-copy {
            margin: 0;
            color: #e8e0ff;
            font-size: 12px;
            font-weight: 900;
            letter-spacing: 0.08em;
        }
        #root {
            position: fixed;
            inset: 0;
            background: #2a1f5c;
        }
        @keyframes boot-float {
            0%, 100% { transform: translateY(0) rotate(-1deg); }
            50% { transform: translateY(-8px) rotate(1deg); }
        }
        @keyframes boot-indeterminate {
            0%   { width: 12%; transform: translateX(0); }
            50%  { width: 55%; transform: translateX(40%); }
            100% { width: 12%; transform: translateX(220%); }
        }
    </style>
</head>
<body>
    <!-- ADAPT: aria-label game name -->
    <div id="boot-cover" role="progressbar" aria-busy="true" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-label="Loading PIXEL FOUNDRY">
        <div class="boot-mark" aria-hidden="true">
            <span class="boot-eye boot-eye-l"></span>
            <span class="boot-eye boot-eye-r"></span>
            <span class="boot-smile"></span>
        </div>
        <div class="boot-title">
            <!-- ADAPT: title marks -->
            <span>PIXEL</span>
            <strong>FOUNDRY</strong>
        </div>
        <div class="boot-track"><div class="boot-fill" id="boot-fill"></div></div>
        <p class="boot-copy" id="boot-copy">BUILDING THE FUN…</p>
    </div>
        <!--
            Boot watchdog.

            Every recovery path in this game lives inside the module bundle: the
            boot() catch, the host handshake timeout, the asset timeouts. All of
            them need that bundle to have executed. When it never fetches, never
            parses, or throws at import time on an old WebView, none of it runs
            and #boot-cover stays up forever with no way out.

            A classic script on purpose: it must run even when the module graph
            is the thing that failed.

            It does NOT decide failure on elapsed time alone. A slow connection
            and a dead bundle look identical to a stopwatch, and firing on the
            slow one would tell a player their game is broken while it is still
            downloading. Instead the certain signals act immediately — the
            script's own error event, and an uncaught module-evaluation error —
            and the clock is only a last-resort backstop, held off while the
            network is still delivering bytes.

            Outcomes are recorded to localStorage rather than reported here: a
            boot that failed this badly has no analytics module to report with.
            The next successful boot picks the record up and emits it.
        -->
        <script>
            (function () {
                var SLOW_MS = 8000;      // "this is taking a while", not a failure
                var BACKSTOP_MS = 60000; // last resort, only once fetching has stopped
                var CEILING_MS = 180000; // absolute cap, for a connection that hangs open
                var QUIET_MS = 30000;    // no bytes and no repaint for this long = stalled
                var lastMutationAt = Date.now();
                var KEY = "GAME_ID:boot-failure:v1"; // ADAPT: use this game's id
                var boot = (window.__boot = {
                    startedAt: Date.now(),
                    slowMs: null,
                    outcome: null,
                    settled: false,
                });

                function elapsed() { return Date.now() - boot.startedAt; }

                // The game paints load progress into the cover; every repaint is
                // proof the bundle is running, which no network metric can show.
                try {
                    var cover0 = document.getElementById("boot-cover");
                    if (cover0 && window.MutationObserver) {
                        new MutationObserver(function () { lastMutationAt = Date.now(); })
                            .observe(cover0, { subtree: true, childList: true, characterData: true, attributes: true });
                    }
                } catch (_) { /* observation is best-effort */ }

                function coverUp() {
                    var c = document.getElementById("boot-cover");
                    return !!c && !c.classList.contains("hidden");
                }

                /**
                 * Has anything happened recently?
                 *
                 * Three independent signs of life, because each alone lies:
                 *  - `readyState` goes "complete" while lazy chunks are still
                 *    being imported, so it under-reports.
                 *  - the resource timeline records only COMPLETED requests, so a
                 *    chunk in flight for 30s leaves a hole that looks idle.
                 *  - so the decisive one is the boot cover itself: the game
                 *    paints progress into it as it loads, and any mutation there
                 *    proves the bundle is running and advancing.
                 *
                 * Reading a quiet moment as "dead" is the exact false positive
                 * this watchdog must not produce, so any one of the three counts
                 * as alive.
                 */
                function recentlyAlive() {
                    if (document.readyState !== "complete") return true;
                    if (Date.now() - lastMutationAt < QUIET_MS) return true;
                    try {
                        var e = performance.getEntriesByType("resource");
                        var last = 0;
                        for (var i = 0; i < e.length; i++) {
                            var end = e[i].responseEnd || e[i].startTime || 0;
                            if (end > last) last = end;
                        }
                        return e.length > 0 && performance.now() - last < QUIET_MS;
                    } catch (_) { return false; }
                }

                function persist(reason) {
                    try {
                        window.localStorage.setItem(KEY, JSON.stringify({
                            reason: reason, elapsed_ms: elapsed(), at: new Date().toISOString(),
                        }));
                    } catch (_) { /* private mode; the UI still recovers */ }
                }

                function fail(reason) {
                    if (boot.settled || !coverUp()) return;
                    boot.settled = true;
                    boot.outcome = reason;
                    persist(reason);
                    var cover = document.getElementById("boot-cover");
                    var copy = cover.querySelector("#boot-copy");
                    if (copy) copy.textContent = "COULD NOT LOAD";
                    var bar = cover.querySelector(".boot-track");
                    if (bar && bar.parentNode) bar.parentNode.removeChild(bar);
                    var panel = cover.querySelector(".boot-panel") || cover;
                    var hint = document.createElement("p");
                    hint.textContent = "Check your connection and reload.";
                    hint.style.cssText = "margin:10px 0 0;font-size:13px;opacity:.8";
                    var retry = document.createElement("button");
                    retry.type = "button";
                    retry.textContent = "RELOAD";
                    retry.style.cssText =
                        "margin-top:14px;min-height:44px;padding:0 22px;font:inherit;font-size:14px;" +
                        "cursor:pointer;border:1px solid currentColor;border-radius:8px;" +
                        "background:transparent;color:inherit";
                    retry.addEventListener("click", function () { window.location.reload(); });
                    panel.appendChild(hint);
                    panel.appendChild(retry);
                    cover.setAttribute("aria-busy", "false");
                }

                // Certain signal 1: the module bundle never arrived.
                document.addEventListener("error", function (e) {
                    var t = e.target;
                    if (t && t.tagName === "SCRIPT" && t.type === "module") fail("script_load_error");
                }, true);

                // Certain signal 2: it arrived and threw while evaluating.
                window.addEventListener("error", function (e) {
                    if (boot.settled || !coverUp()) return;
                    if (e && e.message) fail("script_eval_error");
                });

                // Slow, but still alive — recorded, never shown as a failure.
                window.setTimeout(function () {
                    if (!boot.settled && coverUp()) boot.slowMs = SLOW_MS;
                }, SLOW_MS);

                // Backstop: only when nothing has arrived for a long while.
                boot.timer = window.setTimeout(function tick() {
                    if (boot.settled || !coverUp()) return;
                    if (recentlyAlive() && elapsed() < CEILING_MS) {
                        boot.timer = window.setTimeout(tick, 10000);
                        return;
                    }
                    fail(elapsed() >= CEILING_MS ? "ceiling" : "timeout");
                }, BACKSTOP_MS);
            })();
        </script>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
</body>
</html>
